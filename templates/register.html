{% extends "base.html" %}
{% block content %}
<div class="card form-card">
  <h2>{{ t('register') }}</h2>
  <form method="POST">
    <label>{{ t('name') }}</label>
    <input type="text" name="name" required>

    <label>{{ t('email') }}</label>
    <input type="email" name="email" required>

    <label>{{ t('password') }}</label>
    <input type="password" name="password" required>

    <label>{{ t('select_role') }}</label>
    <select name="role" id="role" onchange="updateSubtype()" required>
      <option value="farmer" {{ 'selected' if request.args.get('role')=='farmer' else '' }}>{{ t('farmer') }}</option>
      <option value="buyer" {{ 'selected' if request.args.get('role')=='buyer' else '' }}>{{ t('buyer') }}</option>
    </select>

    <label>{{ t('select_subtype') }}</label>
    <select name="sub_type" id="sub_type"></select>

    <button type="submit" class="btn btn-primary">{{ t('register') }}</button>
  </form>
  <p>{{ t('already_have_account') }} <a href="{{ url_for('login') }}">{{ t('login') }}</a></p>
</div>

<script>
const options = {
  farmer: [["private", "{{ t('private') }}"], ["public", "{{ t('public') }}"]],
  buyer: [["consumer", "{{ t('consumer') }}"], ["retailer", "{{ t('retailer') }}"], ["wholesale", "{{ t('wholesale') }}"]],
};
function updateSubtype() {
  const role = document.getElementById('role').value;
  const sub = document.getElementById('sub_type');
  sub.innerHTML = "";
  options[role].forEach(([val, label]) => {
    const opt = document.createElement('option');
    opt.value = val; opt.textContent = label;
    sub.appendChild(opt);
  });
}
updateSubtype();
</script>
{% endblock %}
